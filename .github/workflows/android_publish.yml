name: Android Publish
run-name: Android Publish execute by @${{ github.actor }}

on: [ workflow_dispatch ]

env:
  SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
  SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
  SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'corretto'
          java-version: '17'
          cache: 'gradle'
          check-latest: true

      # Paquete y versión salen de gradle.properties una sola vez y se pasan como salidas del paso
      # (steps.app.outputs), la forma documentada de usar el valor de un paso en los parámetros de otro.
      - name: Read App Info
        id: app
        run: |
          package=$(grep '^APP_ID=' gradle.properties | cut -d'=' -f2)
          version=$(grep '^VERSION_NAME=' gradle.properties | cut -d'=' -f2)
          [ -n "$package" ] && [ -n "$version" ] || { echo "::error::Faltan APP_ID o VERSION_NAME en gradle.properties"; exit 1; }
          echo "App: $package $version"
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Las notas viven en play-store/release-notes/<VERSION_NAME>.txt con un bloque <idioma>…</idioma> por idioma;
      # Play las espera como un archivo whatsnew-<idioma> por idioma, de 500 caracteres como máximo.
      - name: Prepare Release Notes
        env:
          VERSION: ${{ steps.app.outputs.version }}
        run: |
          notes="play-store/release-notes/$VERSION.txt"
          [ -f "$notes" ] || { echo "::error::Falta $notes con las notas de la versión"; exit 1; }
          mkdir -p build/whatsnew
          awk '
            /^<[A-Za-z][A-Za-z0-9-]*>$/ { file = "build/whatsnew/whatsnew-" substr($0, 2, length($0) - 2); next }
            /^<\/[A-Za-z0-9-]+>$/ { file = ""; next }
            file != "" { print > file }
          ' "$notes"
          ls build/whatsnew/whatsnew-* > /dev/null 2>&1 || { echo "::error::$notes no tiene bloques <idioma>"; exit 1; }
          for f in build/whatsnew/whatsnew-*; do
            n=$(LC_ALL=C.UTF-8 wc -m < "$f")
            echo "$f: $n caracteres"
            [ "$n" -le 500 ] || { echo "::error::$f tiene $n caracteres y Play acepta 500"; exit 1; }
          done

      - name: Tests and Lint
        run: ./gradlew :app:testReleaseUnitTest :app:lintRelease

      - name: Signing App Release
        run: |
          ./gradlew app:bundleRelease
          ./gradlew app:assembleRelease

      - name: Upload Artifact APK Release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk-release
          path: ./app/build/outputs/apk/release

      - name: Upload Artifact Bundle Release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk-bundle-release
          path: ./app/build/outputs/bundle/release

      - name: Deploy to Open Testing (beta)
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.SIGNING_SERVICE_ACCOUNT }}
          packageName: ${{ steps.app.outputs.package }}
          releaseFiles: ./app/build/outputs/bundle/release/app-release.aab
          tracks: beta
          whatsNewDirectory: build/whatsnew
          changesNotSentForReview: true

      - name: Create Tag Release
        env:
          VERSION: ${{ steps.app.outputs.version }}
        run: |
          git tag "$VERSION"
          git push origin --tags
