<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>AllSet · Gráfico de funciones</title>
    <!-- Source of feature-graphic.png (1024×500). Regenerate with:
         "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
           --force-device-scale-factor=1 --window-size=1024,500 \
           --screenshot=feature-graphic.png feature-graphic.html -->
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
        }

        html, body {
            width: 1024px;
            height: 500px;
            overflow: hidden;
        }

        body {
            display: flex;
            align-items: center;
            gap: 56px;
            padding: 0 88px;
            background: radial-gradient(circle at 20% 30%, #13b56b 0%, #0fa05e 45%, #0b8650 100%);
            color: #ffffff;
            font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Roboto, sans-serif;
        }

        img {
            width: 300px;
            height: 300px;
            border-radius: 64px;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.25), 0 0 0 6px rgba(255, 255, 255, 0.18);
        }

        h1 {
            font-size: 52px;
            font-weight: 800;
            line-height: 1.12;
            letter-spacing: -0.5px;
        }

        p {
            margin-top: 20px;
            font-size: 28px;
            font-weight: 500;
            opacity: 0.92;
        }
    </style>
</head>
<body>
<img src="icon.png" alt="">
<div>
    <h1>Ejemplos prácticos de Android</h1>
    <p>12 demos con Jetpack Compose<br>y Material 3</p>
</div>
</body>
</html>
