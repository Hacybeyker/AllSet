name: Android Publish
run-name: Android Publish execute by @${{ github.actor }}

on: [ workflow_dispatch ]

env:
  PACKAGE: ${{ secrets.PACKAGE }}
  SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
  SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
  SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'
          check-latest: true

      - name: Setup Project
        uses: ./.github/actions/android

      - name: Signing App Release
        run: |
          ./gradlew app:bundleRelease
          ./gradlew app:assembleRelease

      - name: Upload Artifact APK Release
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: ./app/build/outputs/apk/release

      - name: Upload Artifact Bundle Release
        uses: actions/upload-artifact@v4
        with:
          name: apk-bundle-release
          path: ./app/build/outputs/bundle/release

      - name: Create Tag Release
        run: |
          versionName=$(grep '^VERSION_NAME=' gradle.properties | cut -d'=' -f2)
          echo "Version: $versionName"
          git tag "$versionName"
          git push origin --tags

      - name: Obtain Package Name
        run: |
          packageName=$(grep '^APP_ID=' gradle.properties | cut -d'=' -f2)
          echo "PackageName: $packageName"
          echo "PACKAGE=$packageName" >> $GITHUB_ENV

      - name: Deploy to Alpha
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.SIGNING_SERVICE_ACCOUNT }}
          packageName: com.hacybeyker.allset
          releaseFiles: ./app/build/outputs/bundle/release/app-release.aab
          track: beta
          changesNotSentForReview: true