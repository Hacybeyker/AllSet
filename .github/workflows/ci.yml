# CI — corre el DoD de AGENTS.md en cada PR hacia master y en cada push a master.
# No firma ni publica: la publicación es el workflow manual android_publish.yml.
# Las actions van fijadas por SHA; el comentario # vX.Y.Z es el formato que Dependabot sabe actualizar.
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Android — Verify (R8, tests, lint)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # JDK 17 Corretto, el mismo que pide gradle/gradle-daemon-jvm.properties y que usa android_publish.yml.
      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: corretto
          java-version: '17'

      - name: Set up Gradle (con cache)
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # Build Scan solo si el repo es público: los scans van a la instancia pública de Gradle.
          build-scan-publish: ${{ !github.event.repository.private }}
          build-scan-terms-of-use-url: "https://gradle.com/help/legal-terms-of-use"
          build-scan-terms-of-use-agree: "yes"

      - name: DoD (R8, tests y lint)
        run: ./gradlew :app:minifyReleaseWithR8 :app:testDebugUnitTest :app:lintDebug

      # Lint tiene abortOnError = false: el reporte queda como artefacto para revisar los avisos.
      - name: Upload reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: app/build/reports/
          if-no-files-found: ignore
          retention-days: 7
